[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vquant"
version = "0.2.0"
authors = [
  { name = "VQuant Core Team", email = "contact@vquant.org" },
]
description = "A modern Quantitative Trading & Backtesting framework tailored for the Vietnamese Stock Market"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
  "vietnam",
  "stock",
  "quant",
  "backtest",
  "trading",
  "algorithmic-trading",
  "finance",
  "vnindex",
  "vn30"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Office/Business :: Financial :: Investment",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=1.5.0",
  "numpy>=1.22.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
  "import-linter>=2.0",
  "hypothesis>=6.0",
  "twine",
  "build",
]

[project.urls]
"Homepage" = "https://github.com/DeckardShaw31/VQuant"
"Bug Tracker" = "https://github.com/DeckardShaw31/VQuant/issues"
"Documentation" = "https://github.com/DeckardShaw31/VQuant/tree/main/Documentation"

[tool.setuptools.packages.find]
where = ["."]
include = ["vquant*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
